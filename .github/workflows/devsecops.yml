name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # 1. BUILD & FUNCTIONAL TESTS
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Functional Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest (functional + security tests)
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-test-secret-key' }}
          SECURE_MODE: "true"
        run: |
          pytest tests/ -v --tb=short 2>&1

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. SECRET SCANNING (gitleaks)
  # ─────────────────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so gitleaks can diff all commits

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. SAST — Static Analysis (Bandit)
  # ─────────────────────────────────────────────────────────────────────────────
  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Bandit
        run: pip install bandit==1.7.5

      - name: Run Bandit
        # -r app/   : scan app/ recursively
        # -ll       : report High severity only (fails the build)
        # -ii       : report High confidence only
        # --format json : machine-readable output saved as artifact
        run: |
          bandit -r app/ -ll -ii --format json -o bandit-report.json || EXIT_CODE=$?
          bandit -r app/ -ll -ii
          exit ${EXIT_CODE:-0}

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. SCA — Dependency Scanning (pip-audit) + Auto-Remediation via PR
  # ─────────────────────────────────────────────────────────────────────────────
  sca:
    name: SCA (pip-audit + Auto-Remediation)
    runs-on: ubuntu-latest
    needs: build-and-test
    # Only run auto-remediation on push to main, not on PRs
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pip-audit
        id: audit
        run: |
          set +e
          pip-audit -r requirements.txt --format json -o audit_results.json
          AUDIT_EXIT=$?
          set -e

          if [ -s audit_results.json ] && [ "$AUDIT_EXIT" -ne 0 ]; then
            echo "vulns_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "vulns_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: audit_results.json

      - name: Auto-remediate and open PR
        if: steps.audit.outputs.vulns_found == 'true' && github.event_name == 'push'
        run: |
          python remediate.py

          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="security/auto-fix-deps-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add requirements.txt
          git commit -m "fix: auto-update vulnerable dependencies [security bot]"
          git push origin "$BRANCH"

          gh pr create \
            --title "Security: auto-update vulnerable dependencies" \
            --body "$(cat <<'EOF'
          ## Automated Dependency Security Fix

          This PR was opened automatically by the SCA pipeline because **pip-audit** detected
          one or more CVEs in the current \`requirements.txt\`.

          ### Changes
          - Updated vulnerable package(s) to the minimum safe version reported by pip-audit.

          ### Next steps
          1. Review the changes below.
          2. Run the full test suite to verify nothing breaks.
          3. Merge if tests pass.

          > Generated by the DevSecOps auto-remediation workflow.
          EOF
          )" \
            --base main \
            --head "$BRANCH" \
            --label "security"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. DAST — Dynamic Analysis (OWASP ZAP baseline scan)
  #    Runs only on push to main after a successful build.
  # ─────────────────────────────────────────────────────────────────────────────
  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install & start app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

          # Start Flask app in background
          SECRET_KEY="dast-scan-secret" SECURE_MODE="true" \
            python -m flask --app "app.main:create_app" run --host 0.0.0.0 --port 5000 > app.log 2>&1 &
          APP_PID=$!
          echo "App PID: $APP_PID"

          # Give it more time to start
          sleep 5

          # Check if process is still running
          if ! kill -0 $APP_PID 2>/dev/null; then
            echo "❌ App failed to start!"
            echo "=== App log ==="
            cat app.log
            exit 1
          fi

          # Verify app is responding
          echo "=== Testing app connectivity ==="
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/health)
            if [ "$STATUS" = "200" ]; then
              echo "✓ App is responding (HTTP $STATUS)!"
              curl -s http://localhost:5000/health | head -5
              break
            fi
            echo "Attempt $i/30 (HTTP $STATUS)..."
            sleep 2
          done

          # Show app is running
          echo "=== App process ==="
          ps aux | grep "flask\|python" | grep -v grep

      - name: Run OWASP ZAP scan
        run: |
          mkdir -p /tmp/zap-reports
          chmod 777 /tmp/zap-reports

          # Verify app is still running before ZAP scan
          echo "=== Verifying app before ZAP scan ==="
          curl -s http://localhost:5000/health || echo "App not responding!"

          # Run ZAP full scan with active scanning
          # Reports are relative to /zap/wrk inside the container
          echo "=== Starting full OWASP ZAP active scan ==="
          docker run --rm \
            --network host \
            -v /tmp/zap-reports:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py \
              -t http://localhost:5000 \
              -r report_html.html \
              -J report.json \
              -x report.xml \
              -a -d -m 2 || true

          # Check what was generated
          echo "=== ZAP output directory ==="
          ls -lah /tmp/zap-reports/

          # Copy reports to workspace
          cp /tmp/zap-reports/report_html.html . 2>/dev/null && echo "✓ HTML report copied" || echo "⚠ HTML report missing"
          cp /tmp/zap-reports/report.json .      2>/dev/null && echo "✓ JSON report copied" || echo "⚠ JSON report missing"
          cp /tmp/zap-reports/report.xml .       2>/dev/null && echo "✓ XML report copied"  || echo "⚠ XML report missing"

      - name: Check generated reports
        if: always()
        run: |
          echo "=== Report files in workspace ==="
          ls -lah report_html.html report.json 2>/dev/null || echo "No report files"

          if [ -f report_html.html ]; then
            echo "=== First 500 bytes of report_html.html ==="
            head -c 500 report_html.html
          fi
          ls -la

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-full-scan-report
          path: |
            report_html.html
            report.json
            report.xml
          if-no-files-found: warn
