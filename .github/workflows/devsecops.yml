name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # 1. BUILD & FUNCTIONAL TESTS
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Functional Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest (functional + security tests)
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-test-secret-key' }}
          SECURE_MODE: "true"
        run: |
          pytest tests/ -v --tb=short 2>&1

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. SECRET SCANNING (gitleaks)
  # ─────────────────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so gitleaks can diff all commits

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. SAST — Static Analysis (Bandit)
  # ─────────────────────────────────────────────────────────────────────────────
  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Bandit
        run: pip install bandit==1.7.5

      - name: Run Bandit
        # -r app/   : scan app/ recursively
        # -ll       : report High severity only (fails the build)
        # -ii       : report High confidence only
        # --format json : machine-readable output saved as artifact
        run: |
          bandit -r app/ -ll -ii --format json -o bandit-report.json || EXIT_CODE=$?
          bandit -r app/ -ll -ii
          exit ${EXIT_CODE:-0}

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. SCA — Dependency Scanning (pip-audit) + Auto-Remediation via PR
  # ─────────────────────────────────────────────────────────────────────────────
  sca:
    name: SCA (pip-audit + Auto-Remediation)
    runs-on: ubuntu-latest
    needs: build-and-test
    # Only run auto-remediation on push to main, not on PRs
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pip-audit
        id: audit
        run: |
          set +e
          pip-audit -r requirements.txt --format json -o audit_results.json
          AUDIT_EXIT=$?
          set -e

          if [ -s audit_results.json ] && [ "$AUDIT_EXIT" -ne 0 ]; then
            echo "vulns_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "vulns_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: audit_results.json

      - name: Auto-remediate and open PR
        if: steps.audit.outputs.vulns_found == 'true' && github.event_name == 'push'
        run: |
          python remediate.py

          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="security/auto-fix-deps-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add requirements.txt
          git commit -m "fix: auto-update vulnerable dependencies [security bot]"
          git push origin "$BRANCH"

          gh pr create \
            --title "Security: auto-update vulnerable dependencies" \
            --body "$(cat <<'EOF'
          ## Automated Dependency Security Fix

          This PR was opened automatically by the SCA pipeline because **pip-audit** detected
          one or more CVEs in the current \`requirements.txt\`.

          ### Changes
          - Updated vulnerable package(s) to the minimum safe version reported by pip-audit.

          ### Next steps
          1. Review the changes below.
          2. Run the full test suite to verify nothing breaks.
          3. Merge if tests pass.

          > Generated by the DevSecOps auto-remediation workflow.
          EOF
          )" \
            --base main \
            --head "$BRANCH" \
            --label "security"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. DAST — Dynamic Analysis (OWASP ZAP baseline scan)
  #    Runs only on push to main after a successful build.
  # ─────────────────────────────────────────────────────────────────────────────
  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install & start app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          SECRET_KEY="dast-scan-secret" SECURE_MODE="true" \
            flask --app "app.main:create_app" run --host 0.0.0.0 --port 5000 &
          # Wait for the server to be ready
          sleep 5
          curl -f http://localhost:5000/health

      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:5000"
          rules_file_name: ".zap/rules.tsv"
          fail_action: false   # warn only; set to true to fail the build on findings
          artifact_name: "zap-baseline-report"

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: report_html.html
