name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Functional Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Test with pytest
      run: |
        pytest tests/

  security-sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install Bandit
      run: pip install bandit==1.7.5
    - name: Run Bandit Security Scanner
      # -r app/ : recursively scan 'app' directory
      # -ll : only report High severity issues (-lll is critical, -ll is high, -l is medium)
      # -ii : only report High confidence issues
      # If Bandit finds High severity issues like hardcoded passwords, it will exit with a non-zero code and fail the build.
      run: bandit -r app/ -ll

  security-sca:
    name: SCA (Dependency Scanner)
    runs-on: ubuntu-latest
    needs: build-and-test
    # This step is intentionally expected to fail due to urllib3 vulnerability
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install pip-audit
      run: pip install pip-audit==2.7.0
    - name: Run pip-audit Vulnerability Scanner
      # Runs pip-audit against our requirements.txt
      run: pip-audit -r requirements.txt
